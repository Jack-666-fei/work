spring.application.name=rag
# ============ Spring AI 2.0 - OpenAI 兼容协议（LM Studio） ============
# LM Studio 默认本地服务地址
spring.ai.openai.base-url=http://localhost:1234/v1
# LM Studio 无需真实密钥，填写占位即可
spring.ai.openai.api-key=lm-studio
# 对话模型：google/gemma-4-e2b（LM Studio 中已下载加载）
spring.ai.openai.chat.options.model=google/gemma-4-e2b
spring.ai.openai.chat.options.temperature=0.7
# 向量嵌入模型：使用 LM Studio 中实际已安装的 nomic-embed-text-v1.5（768 维）
spring.ai.openai.embedding.options.model=text-embedding-nomic-embed-text-v1.5
# ============ Milvus 向量库（docker compose 部署，见 milvus-deploy/docker-compose.yml） ============
spring.ai.vectorstore.milvus.client.host=127.0.0.1
spring.ai.vectorstore.milvus.client.port=19530
spring.ai.vectorstore.milvus.collection-name=jmu_handbook
spring.ai.vectorstore.milvus.embedding-dimension=768
spring.ai.vectorstore.milvus.initialize-schema=true
# ============ 多轮会话记忆 ============
# 记忆窗口保留的消息条数（1 轮问答 = 2 条消息），超出后丢弃最早的。
# 调小可降低本地小显存模型的推理压力，调大会占用更多上下文。
rag.chat.memory.max-messages=20
# ============ RAG 检索增强 ============
# 每次提问从 Milvus 检索的候选资料条数。
# 【本机实测最优值 = 10】硬件不同结果会不同，不要照搬别的机器。
# 依据：用新生手册 10 道题做基准扫描 topK×阈值 网格，实测
#   topK=3  → Recall 42.9%
#   topK=5  → Recall 42.9%
#   topK=8  → Recall 57.1%
#   topK=10 → Recall 71.4%   ← 拐点，再往上不再提升
#   topK=15 → Recall 71.4%（但平均多返回 4 条噪声）
rag.chat.rag.top-k=10
# 相似度阈值。0 表示不做过滤。
# 【本机实测最优值 = 0.6】
# 本机嵌入模型(nomic-embed-text)对中文区分度弱，分数全挤在 0.65~0.73，
# 所以阈值可用的窗口很窄：
#   0 ~ 0.60  → 召回率完全一样(71.4%)，但 0.6 平均少返回 1 条噪声
#   0.65      → 召回率掉到 57.1%
#   0.70      → 灾难，5/7 的题直接返回空结果，召回率仅 14.3%
# 换更强的中文嵌入模型后，分数会拉开，这个阈值应重新标定。
rag.chat.rag.similarity-threshold=0.6
# 是否启用 RAG。设为 false 则退化为纯聊天（既不检索、也不注入手册角色），
# 可用于对比「接 RAG」与「不接 RAG」的回答差异。
rag.chat.rag.enabled=true
# ============ 日志 ============
# 日志目录（与 logback-spring.xml 共用同一配置项，避免两处不一致）
rag.logs.dir=logs
# 召回日志详细程度: off | brief | full | prompt
#   off    = 不打召回内容，只留一行汇总
#   brief  = query + 命中数 + 每条分数/章节（不打正文）
#   full   = brief + 每条完整正文            ← 默认，排查召回问题用这个
#   prompt = full + 最终发给模型的完整 prompt（最详细、最占空间，默认不开）
rag.logs.retrieval-level=full
# 单条召回正文的打印上限（字符）。0 = 不截断
rag.logs.retrieval-max-chars=0
# 低分告警阈值。<=0 表示关闭。
# 当前嵌入模型对中文的相似度普遍挤在 0.6~0.69（相关与不相关几乎分不开），
# 设成 0.75 之类会导致每次都告警、变成噪音，所以默认关闭，只打印分数本身。
# 等换成中文嵌入模型、分数拉开以后再来设这个值。
rag.logs.low-score-threshold=0
# 日志导出接口开关
rag.logs.export.enabled=true
# 日志导出接口是否只允许本机访问。
# 日志含提问原文与手册正文，建议保持 true（尤其在校园网环境下）。
rag.logs.export.localhost-only=true
# GET /api/logs/tail 单次返回的最大行数
rag.logs.tail.max-lines=5000
# ============ 文档清洗（导入前）============
# 是否在向量化之前对文档做清洗。关闭则使用原始文本。
# 清洗规则：过滤校歌曲调(保留歌词)、过滤目录章节、保护表格完整
rag.kb.clean.enabled=true
# 校歌章节内判定「歌词行」的汉字占比阈值。
# 低于此值的行被认定为曲调(简谱/调号/拍号)并删除。
# 实测歌词行最低 0.80、曲调行最高 0.29，取 0.5 有很宽的安全区。
rag.kb.clean.lyrics-cjk-ratio=0.5
# ============ Knife4j / OpenAPI 文档 ============
knife4j.enable=true
knife4j.setting.language=zh_cn
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
